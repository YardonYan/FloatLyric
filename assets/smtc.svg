<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="网易云走 CDP 直连，QQ音乐、Spotify、浏览器走系统媒体接口，都汇聚到浮词歌词条">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif; }
  </style>
  <rect width="1200" height="400" fill="#F6F8FB"/>

  <!-- ===== player cards ===== -->
  <!-- NetEase: direct CDP -->
  <rect x="52" y="54" width="252" height="58" rx="12" fill="#FFFFFF" stroke="#3D5AA8" stroke-width="2"/>
  <circle cx="82" cy="83" r="13" fill="#E8EEF7"/>
  <path d="M77 88c-2-1.5-2-4.5.5-5 0-3 4-4 5.5-1.5 2.5-1 4 1.5 2.5 3.5 1.5 2 0 4.5-2.5 4-1 1.5-4.5 1.5-6-1z" fill="#3D5AA8"/>
  <text x="104" y="80" font-size="14" font-weight="600" fill="#243044">网易云音乐</text>
  <text x="104" y="98" font-size="10.5" fill="#5A6678">CDP 直连 · 约 0.1 秒精度</text>
  <rect x="238" y="62" width="52" height="18" rx="9" fill="#3D5AA8"/>
  <text x="264" y="74.5" text-anchor="middle" font-size="9.5" fill="#FFFFFF">优先</text>

  <!-- QQ Music -->
  <rect x="52" y="134" width="252" height="58" rx="12" fill="#FFFFFF" stroke="#D9E0EA" stroke-width="1.5"/>
  <circle cx="82" cy="163" r="13" fill="#FFF3E9"/>
  <text x="82" y="168" text-anchor="middle" font-size="12" fill="#C86B3C">♪</text>
  <text x="104" y="160" font-size="14" font-weight="600" fill="#243044">QQ音乐</text>
  <text x="104" y="178" font-size="10.5" fill="#5A6678">系统媒体 SMTC · 约 0.5 秒</text>

  <!-- Spotify -->
  <rect x="52" y="214" width="252" height="58" rx="12" fill="#FFFFFF" stroke="#D9E0EA" stroke-width="1.5"/>
  <circle cx="82" cy="243" r="13" fill="#E3F6EB"/>
  <text x="82" y="248" text-anchor="middle" font-size="12" fill="#1DB954">♪</text>
  <text x="104" y="240" font-size="14" font-weight="600" fill="#243044">Spotify</text>
  <text x="104" y="258" font-size="10.5" fill="#5A6678">系统媒体 SMTC · 约 0.5 秒</text>

  <!-- Browsers -->
  <rect x="52" y="294" width="252" height="58" rx="12" fill="#FFFFFF" stroke="#D9E0EA" stroke-width="1.5"/>
  <circle cx="82" cy="323" r="13" fill="#EEF1F6"/>
  <circle cx="82" cy="323" r="7" fill="none" stroke="#5A6678" stroke-width="1.6"/>
  <ellipse cx="82" cy="323" rx="7" ry="2.8" fill="none" stroke="#5A6678" stroke-width="1.2"/>
  <text x="104" y="320" font-size="14" font-weight="600" fill="#243044">浏览器 / 其他播放器</text>
  <text x="104" y="338" font-size="10.5" fill="#5A6678">向 Windows 报告媒体即可</text>

  <!-- ===== converge lines ===== -->
  <!-- NetEase: solid accent line -->
  <path d="M304 83 C 480 83, 560 190, 708 190" fill="none" stroke="#3D5AA8" stroke-width="2.5"/>
  <text x="470" y="74" font-size="11.5" fill="#3D5AA8">CDP 直连 · 精确同步 · 播放控制</text>

  <!-- SMTC: dashed flowing lines -->
  <path d="M304 163 C 500 163, 560 190, 708 190" fill="none" stroke="#7A8AA5" stroke-width="2" stroke-dasharray="7 7">
    <animate attributeName="stroke-dashoffset" from="28" to="0" dur="1.1s" repeatCount="indefinite"/>
  </path>
  <path d="M304 243 C 500 243, 560 196, 708 192" fill="none" stroke="#7A8AA5" stroke-width="2" stroke-dasharray="7 7">
    <animate attributeName="stroke-dashoffset" from="28" to="0" dur="1.3s" repeatCount="indefinite"/>
  </path>
  <path d="M304 323 C 520 323, 570 198, 708 194" fill="none" stroke="#7A8AA5" stroke-width="2" stroke-dasharray="7 7">
    <animate attributeName="stroke-dashoffset" from="28" to="0" dur="1.5s" repeatCount="indefinite"/>
  </path>
  <text x="450" y="310" font-size="11.5" fill="#5A6678">SMTC 兜底 · 自动搜词 · 播放控制 · 统计照常</text>

  <circle cx="716" cy="190" r="8" fill="#3D5AA8"/>

  <!-- ===== the strip ===== -->
  <rect x="748" y="130" width="400" height="120" rx="14" fill="#FFFFFF" stroke="#D9E0EA" stroke-width="1.5"/>
  <circle cx="774" cy="156" r="5" fill="#FF5F57"/>
  <circle cx="792" cy="156" r="5" fill="#FEBC2E"/>
  <circle cx="810" cy="156" r="5" fill="#28C840"/>
  <text x="768" y="188" font-size="19" fill="#3D434B">等午夜再唤醒我自己
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.42;0.5;0.92;1" dur="8s" repeatCount="indefinite"/>
  </text>
  <text x="768" y="188" font-size="19" fill="#3D434B">任意播放器的那一句
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.42;0.5;0.92;1" dur="8s" repeatCount="indefinite"/>
  </text>
  <text x="768" y="212" font-size="12" fill="#5A6678" opacity="0.85">自动搜索歌词 · 支持翻译行</text>
  <rect x="1040" y="220" width="88" height="19" rx="9.5" fill="#F6F8FB" stroke="#3D5AA8" stroke-opacity="0.45"/>
  <text x="1084" y="233" text-anchor="middle" font-size="10" fill="#3D5AA8">♪ 间奏 · 8s</text>
  <text x="768" y="238" font-size="10.5" fill="#5A6678">连上网易云即自动切回直连</text>

  <!-- ===== footnote ===== -->
  <text x="600" y="378" text-anchor="middle" font-size="15" fill="#5A6678">同一个歌词条，两种跟随方式：面板一个开关，随时停用系统媒体兜底。</text>
</svg>
