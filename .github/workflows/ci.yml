name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint

  build:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Unpacked build only: proves the app packages, without paying for a
      # portable self-extractor on every push.
      - run: npm run dist:dir
      - uses: actions/upload-artifact@v4
        with:
          name: FloatLyric-unpacked
          path: dist/win-unpacked
          retention-days: 7